name: Bug report
description: Report a reproducible MCP Toolbox issue without sharing secrets or private prompts.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove credentials, tokens, private prompts, and sensitive client configuration before posting.
  - type: input
    id: version
    attributes:
      label: MCP Toolbox version
      description: Package version if known.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Affected tool
      options:
        - hash_text
        - format_json
        - base64_encode
        - base64_decode
        - text_stats
        - new_uuid
        - utc_now
        - MCP server / connection
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.x"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      description: Client name/version if the problem involves the MCP connection.
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include sanitized input and the smallest sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error text where possible.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety check
      options:
        - label: I removed tokens, credentials, secrets, private prompts, and identifying client data.
          required: true
